trigger: none

stages:
  - stage: DeployProduction
    jobs:
      - deployment: Prod
        environment: azureml-prod
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/download-manifest.yml
                - task: DownloadPipelineArtifact@2
                  displayName: Download Test attestation
                  inputs:
                    buildType: specific
                    project: $(System.TeamProject)
                    definition: AzureML-TEST
                    buildVersionToDownload: latestFromBranch
                    branchName: refs/heads/main
                    artifactName: test-attestation
                    targetPath: $(Pipeline.Workspace)/attestation
                - bash: jq -e '.passed == true' $(Pipeline.Workspace)/attestation/test-attestation.json
                  displayName: Verify Test attestation
                - template: templates/aml-login.yml
                  parameters: {serviceConnection: $(azureServiceConnectionProd)}
                - task: AzureCLI@2
                  displayName: Deploy Test-approved model to Production
                  inputs:
                    azureSubscription: $(azureServiceConnectionProd)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      export ENDPOINT_NAME=$(prodEndpoint)
                      envsubst < aml/endpoints/endpoint.yml > rendered-endpoint.yml
                      python scripts/render_aml.py aml/endpoints/deployment.template.yml rendered-deployment.yml \
                        ENDPOINT_NAME=$(prodEndpoint) REGISTRY_NAME=$(amlRegistry) MODEL_NAME=iris-classifier \
                        MODEL_VERSION=$(assetVersion) ASSET_VERSION=$(assetVersion)
                      az ml online-endpoint create --file rendered-endpoint.yml --resource-group $(prodResourceGroup) --workspace-name $(prodWorkspace) || true
                      az ml online-deployment create --file rendered-deployment.yml --all-traffic \
                        --resource-group $(prodResourceGroup) --workspace-name $(prodWorkspace)

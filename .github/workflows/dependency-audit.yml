name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install project and auditor
        run: >-
          python -m pip install --upgrade pip 'setuptools>=83' &&
          pip install . pip-audit
      - name: Audit dependencies
        # MLflow 3.15.x requires cryptography<50; remove this exception when
        # MLflow supports cryptography 50, which fixes PYSEC-2026-3552.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-3552
